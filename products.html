<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LUVIRA Admin | Products</title>

<link rel="stylesheet" href="variables.css">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="layout.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="responsive.css">

<link rel="stylesheet" href="products.css">

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/all.min.css" rel="stylesheet">

</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <aside class="sidebar">

        <div class="logo">
            <h2>LUVIRA</h2>
            <span>Admin Panel</span>
        </div>

        <ul>

            <li>
                <a href="dashboard.html">
                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard
                </a>
            </li>

            <li class="active">
                <a href="products.html">
                    <i class="fa-solid fa-box"></i>
                    Products
                </a>
            </li>

            <li>
                <a href="orders.html">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Orders
                </a>
            </li>

            <li>
                <a href="customers.html">
                    <i class="fa-solid fa-users"></i>
                    Customers
                </a>
            </li>

            <li>
                <a href="shipping.html">
                    <i class="fa-solid fa-truck"></i>
                    Shipping
                </a>
            </li>

            <li>
                <a href="coupons.html">
                    <i class="fa-solid fa-ticket"></i>
                    Coupons
                </a>
            </li>

            <li>
                <a href="settings.html">
                    <i class="fa-solid fa-gear"></i>
                    Settings
                </a>
            </li>

        </ul>

    </aside>

    <main class="main">
    <!-- Top Bar -->

<div class="topbar">

    <div>

        <h2>Products</h2>

        <p>Manage all store products</p>

    </div>

    <button id="addProductBtn" class="primary-btn">

        <i class="fa-solid fa-plus"></i>

        Add Product

    </button>

</div>

<!-- Product Form -->

<div class="card">

    <div class="card-header">

        <h3>Add New Product</h3>

    </div>

    <div class="card-body">

        <form id="productForm">

            <div class="form-grid">

                <div class="form-group">

                    <label>Product Name</label>

                    <input
                        type="text"
                        id="productName"
                        placeholder="Product Name"
                        required>

                </div>

                <div class="form-group">

                    <label>Category</label>

                    <input
                        type="text"
                        id="category"
                        placeholder="Category">

                </div>

                <div class="form-group">

                    <label>Brand</label>

                    <input
                        type="text"
                        id="brand"
                        placeholder="Brand">

                </div>

                <div class="form-group">

                    <label>Price</label>

                    <input
                        type="number"
                        id="price"
                        placeholder="0">

                </div>

                <div class="form-group">

                    <label>Old Price</label>

                    <input
                        type="number"
                        id="comparePrice"
                        placeholder="0">

                </div>

                <div class="form-group">

                    <label>Stock</label>

                    <input
                        type="number"
                        id="stock"
                        placeholder="0">

                </div>

            </div>

            <div class="form-group">

                <label>Description</label>

                <textarea
                    id="description"
                    rows="6"
                    placeholder="Product Description"></textarea>

            </div>
                        <div class="form-grid">

                <div class="form-group">

                    <label>SKU</label>

                    <input
                        type="text"
                        id="sku"
                        placeholder="SKU">

                </div>

                <div class="form-group">

                    <label>Barcode</label>

                    <input
                        type="text"
                        id="barcode"
                        placeholder="Barcode">

                </div>

                <div class="form-group">

                    <label>Image URL</label>

                    <input
                        type="text"
                        id="image"
                        placeholder="https://...">

                </div>

            </div>

            <div class="checkbox-group">

                <label>

                    <input type="checkbox" id="featured">

                    Featured Product

                </label>

                <label>

                    <input type="checkbox" id="bestSeller">

                    Best Seller

                </label>

                <label>

                    <input type="checkbox" id="newArrival" checked>

                    New Arrival

                </label>

                <label>

                    <input type="checkbox" id="active" checked>

                    Active

                </label>

            </div>

            <button
                type="submit"
                class="primary-btn">

                Save Product

            </button>

        </form>

    </div>

</div>

<!-- Products Table -->

<div class="card">

    <div class="card-header">

        <h3>Products List</h3>

    </div>

    <div class="card-body">

        <table>

            <thead>

                <tr>

                    <th>Image</th>

                    <th>Name</th>

                    <th>Category</th>

                    <th>Price</th>

                    <th>Stock</th>

                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="productsTable">

            </tbody>

        </table>

    </div>

</div>
    </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="config.js"></script>

<script src="auth.js"></script>

<script src="products.js"></script>

</body>

</html>
