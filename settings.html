<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Store Settings</title>

<link rel="stylesheet" href="settings.css">

</head>

<body>

<h1>⚙️ إعدادات المتجر</h1>

<p>يمكنك تعديل بيانات المتجر من هنا.</p>

<form id="settingsForm">

<div>

<label>اسم المتجر</label>

<input
type="text"
id="storeName"
placeholder="LUVIRA Cosmetics">

</div>

<div>

<label>رقم الواتساب</label>

<input
type="text"
id="whatsapp">

</div>

<div>

<label>البريد الإلكتروني</label>

<input
type="email"
id="email">

</div>

<div>

<label>العنوان</label>

<input
type="text"
id="address">

</div>

<div>

<label>رابط فيسبوك</label>

<input
type="text"
id="facebook">

</div>

<div>

<label>رابط إنستجرام</label>

<input
type="text"
id="instagram">

</div>

<div>

<label>رابط تيك توك</label>

<input
type="text"
id="tiktok">

</div>
<div>

<label>اللوجو (Logo URL)</label>

<input
type="text"
id="logo">

</div>

<div>

<label>العملة</label>

<input
type="text"
id="currency"
value="EGP">

</div>

<div>

<label>قيمة الضريبة (%)</label>

<input
type="number"
id="tax"
value="0">

</div>

<div>

<label>

<input
type="checkbox"
id="storeStatus"
checked>

تشغيل المتجر

</label>

</div>

<br>

<button type="submit">

💾 حفظ الإعدادات

</button>

</form>

<script src="config.js"></script>

<script src="settings.js"></script>

</body>

</html>
